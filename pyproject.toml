[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[project]
name = "huglog"
version = "0.1.0"
description = "Structured logging with spans and telemetry integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Vladimir Lebedev", email = "zeronineseven@gmail.com" }]
keywords = [
    "logging",
    "structured-logging",
    "tracing",
    "spans",
    "observability",
    "telemetry",
    "sentry",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "frozendict>=2.4.0",
    "lazy-object-proxy>=1.12.0",
]

[project.optional-dependencies]
# Output formatters - each with separate dependencies
richhndlr = [
    "rich>=13.0.0",
]
logfmt = [
    "logfmter>=0.0.11",
    "boltons>=23.0.0",
]
jsonfmt = [
    "python-json-logger>=4.0.0",
    "boltons>=23.0.0",
]

# Telemetry integrations
sentry = [
    "sentry-sdk>=2.0.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

# Convenience meta-group
all = [
    "huglog[richhndlr,logfmt,jsonfmt,sentry,otel]",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/SF-300/huglog"
Issues = "https://github.com/SF-300/huglog/issues"

[tool.hatch.version]
path = "src/huglog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/huglog"]

[tool.black]
line-length = 120
target-version = ["py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
